# Local-only Supabase stack. Hosted project references and credentials do not
# belong in this file.
project_id = "bare-traen"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Match the hosted project's secure default: new objects require explicit grants.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Hosted preview branches read this file, so automatic seeding must remain off.
# The repository's local reset script opts in explicitly with --local and
# --sql-paths; seed.sql then performs its own fail-closed local-stack check.
enabled = false
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# The hosted GitHub deployment parser does not yet accept the CLI's newer
# [local_smtp] name. The current CLI still maps this legacy section to Mailpit
# locally (with a deprecation warning), keeping one config valid in both places.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

# Background Edge work must survive the initiating HTTP response locally, just
# as it does in the hosted runtime.
[edge_runtime]
policy = "per_worker"

[functions.process-ai-job]
enabled = true
verify_jwt = true

[auth]
enabled = true
site_url = "http://127.0.0.1:11000"
additional_redirect_urls = [
  "http://127.0.0.1:11000/auth/callback",
  "http://localhost:11000/auth/callback",
  "http://127.0.0.1:11001/auth/callback",
  "http://localhost:11001/auth/callback",
  "baretraen-dev://auth/callback",
  "baretraen-preview://auth/callback",
  "baretraen://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

# New accounts use the confirmation template; returning accounts use the magic
# link template. Both intentionally render the same passwordless email so every
# sign-in offers a six-digit code and a one-use link.
[auth.email.template.confirmation]
subject = "Log ind i Bare Træn"
content_path = "./supabase/templates/passwordless.html"

[auth.email.template.magic_link]
subject = "Log ind i Bare Træn"
content_path = "./supabase/templates/passwordless.html"
