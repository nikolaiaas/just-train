.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #bare-traen-koncept .bt-screen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 248px), 1fr));
      gap: 28px 20px;
      align-items: start;
      width: 100%;
    }

    #bare-traen-koncept .bt-example {
      margin: 0;
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    #bare-traen-koncept .bt-phone {
      width: min(100%, 264px);
      min-height: 548px;
      padding: 12px;
      overflow: hidden;
      border: 1px solid var(--bt-border);
      border-radius: 34px;
      background: var(--bt-surface);
      box-shadow: 0 16px 34px var(--bt-shadow);
    }

    #bare-traen-koncept .bt-phone-top {
      width: 72px;
      height: 6px;
      margin: 0 auto 10px;
      border-radius: 99px;
      background: var(--bt-border);
    }

    #bare-traen-koncept .bt-screen {
      min-height: 508px;
      padding: 16px;
      overflow: hidden;
      border-radius: 24px;
      background: var(--bt-page);
    }

    #bare-traen-koncept .bt-screen.bt-celebration {
      background:
        radial-gradient(circle at 12% 12%, var(--bt-glow) 0 12%, transparent 13%),
        radial-gradient(circle at 86% 18%, var(--bt-glow) 0 9%, transparent 10%),
        var(--bt-page);
    }

    #bare-traen-koncept .bt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    #bare-traen-koncept .bt-kicker,
    #bare-traen-koncept .bt-caption-index {
      margin: 0;
      color: var(--bt-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    #bare-traen-koncept .bt-title {
      margin: 4px 0 4px;
      color: var(--bt-navy);
      font-size: 22px;
      line-height: 1.08;
      font-weight: 500;
    }

    #bare-traen-koncept .bt-copy {
      margin: 0;
      color: var(--bt-muted);
      font-size: 13px;
      line-height: 1.35;
    }

    #bare-traen-koncept .bt-progress-track {
      height: 6px;
      margin: 12px 0 16px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--bt-border);
    }

    #bare-traen-koncept .bt-progress-track &gt; span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--bt-primary);
    }

    #bare-traen-koncept .bt-avatar-large {
      display: block;
      width: 100%;
      height: 244px;
      margin: 14px 0 12px;
      object-fit: cover;
      object-position: center 42%;
      border: 1px solid var(--bt-border);
      border-radius: 22px;
      background-color: var(--bt-soft-warm);
    }

    #bare-traen-koncept .bt-avatar-small {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      object-fit: cover;
      object-position: center 28%;
      border: 3px solid var(--bt-yellow);
      border-radius: 50%;
      background-color: var(--bt-soft-warm);
    }

    #bare-traen-koncept .bt-action {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px 14px;
      border: 0;
      border-radius: 14px;
      background: var(--bt-primary);
      color: var(--bt-primary-text);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
    }

    #bare-traen-koncept .bt-action-secondary {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid var(--bt-border);
      border-radius: 14px;
      background: var(--bt-surface);
      color: var(--bt-ink);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    #bare-traen-koncept .bt-points {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 9px;
      border-radius: 99px;
      background-color: var(--bt-soft-warm);
      color: var(--bt-ink);
      font-size: 12px;
      font-weight: 500;
    }

    #bare-traen-koncept .bt-topic {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--bt-border);
      border-radius: 18px;
      background: var(--bt-surface);
    }

    #bare-traen-koncept .bt-topic-name {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--bt-navy);
      font-size: 14px;
      font-weight: 500;
    }

    #bare-traen-koncept .bt-mission {
      margin-top: 12px;
      padding: 16px;
      border-radius: 20px;
      background: var(--bt-soft);
      box-shadow: inset 0 0 0 1px var(--bt-border);
    }

    #bare-traen-koncept .bt-mission-time {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
      color: var(--bt-primary-deep);
      font-size: 12px;
      font-weight: 500;
    }

    #bare-traen-koncept .bt-mission h4 {
      margin: 0 0 4px;
      color: var(--bt-ink);
      font-size: 17px;
      line-height: 1.2;
      font-weight: 500;
    }

    #bare-traen-koncept .bt-week {
      margin-top: 12px;
      padding: 10px;
      border-radius: 14px;
      background: var(--bt-surface);
      color: var(--bt-muted);
      font-size: 12px;
      text-align: center;
    }

    #bare-traen-koncept .bt-topic-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    #bare-traen-koncept .bt-topic-choice {
      min-height: 112px;
      padding: 14px 10px;
      border: 1px solid var(--bt-border);
      border-radius: 18px;
      background: var(--bt-surface);
      color: var(--bt-ink);
      text-align: left;
    }

    #bare-traen-koncept .bt-topic-choice.bt-featured {
      border: 2px solid var(--bt-primary);
      background: var(--bt-soft);
    }

    #bare-traen-koncept .bt-topic-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: var(--bt-soft-warm);
      font-size: 24px;
    }

    #bare-traen-koncept .bt-topic-choice strong {
      display: block;
      color: var(--bt-navy);
      font-size: 13px;
      font-weight: 500;
    }

    #bare-traen-koncept .bt-topic-choice small {
      display: block;
      margin-top: 3px;
      color: var(--bt-muted);
      font-size: 10px;
    }

    #bare-traen-koncept .bt-skill-list {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    #bare-traen-koncept .bt-skill-option {
      display: grid;
